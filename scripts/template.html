<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>__PAGE_TITLE__</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="__PAGE_TITLE__" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("inter-variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }

      .navigation {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 12.5px 20px;
        height: var(--navigation-height);
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 20;
        border-bottom: 1px solid var(--border);
        background-color: var(--background);
      }

      .navigation-logo {
        display: block;
        height: 40px;
        width: auto;
      }

      .navigation-links {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .navigation-link {
        color: var(--foreground);
        font-size: 14px;
        font-weight: 400;
        line-height: 20px;
        text-decoration: none;
      }

      .navigation-link:hover,
      .navigation-link:focus-visible {
        color: var(--foreground);
        text-decoration: none;
      }

      .navigation-release-notes {
        margin-left: auto;
        position: relative;
      }

      .navigation-release-notes > summary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        color: var(--foreground);
        font-size: 14px;
        font-weight: 400;
        line-height: 20px;
        list-style: none;
      }

      .navigation-release-notes > summary::-webkit-details-marker {
        display: none;
      }

      .navigation-release-notes > summary::after {
        content: "";
        width: 8px;
        height: 8px;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(45deg) translateY(-2px);
      }

      .navigation-release-notes[open] > summary::after {
        transform: rotate(-135deg) translateY(-2px);
      }

      .navigation-release-notes-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 180px;
        display: flex;
        flex-direction: column;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background-color: var(--background);
        box-shadow: 0 6px 16px rgba(52, 55, 65, 0.12);
      }

      .navigation-release-notes-menu a {
        display: block;
        padding: 8px 12px;
        border-radius: 4px;
        color: var(--foreground);
        font-size: 14px;
        line-height: 20px;
        text-decoration: none;
      }

      .navigation-release-notes-menu a:hover,
      .navigation-release-notes-menu a:focus-visible {
        background-color: var(--border);
        text-decoration: none;
      }

      :root {
        color-scheme: light;
        --navigation-height: 66px;
        --background: #ffffff;
        --border: #e5e9f0; /* --color-grey-20 */
        --foreground: #343741; /* --color-ink */
        --muted: #516381; /* --color-subdued */
        --font-sans:
          "Inter", ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
          "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        --font-mono:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans) !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .reference-shell {
        flex: 1;
        min-height: 0;
        padding-top: var(--navigation-height);
      }

      #api-reference {
        --scalar-custom-header-height: var(--navigation-height);
        min-height: calc(100vh - var(--navigation-height));
      }
    </style>
    <script src="scalar-api-reference.js"></script>
  </head>
  <body>
    <nav class="navigation" aria-label="Primary">
      <a href="index.html" aria-label="Introduction">
        <img class="navigation-logo" src="elastic-logo.png" alt="Elastic" />
      </a>
      <div class="navigation-links">
        <a class="navigation-link" href="index.html">Introduction</a>
        <a class="navigation-link" href="dashboards.html">Dashboards</a>
        <a class="navigation-link" href="visualizations.html">Visualizations</a>
        <a class="navigation-link" href="markdowns.html">Markdowns</a>
        <a class="navigation-link" href="links.html">Links</a>
        <a class="navigation-link" href="tags.html">Tags</a>
      </div>
      <details class="navigation-release-notes">
        <summary>Release notes</summary>
        <div class="navigation-release-notes-menu">
          <a
            href="https://www.elastic.co/docs/release-notes/cloud-serverless"
            target="_blank"
            rel="noreferrer"
            >Serverless</a
          >
          <a
            href="https://www.elastic.co/docs/release-notes/kibana"
            target="_blank"
            rel="noreferrer"
            >Kibana</a
          >
        </div>
      </details>
    </nav>
    <div class="reference-shell">
      <div id="api-reference" data-spec-url="__API_SPEC_URL__"></div>
    </div>
    <script src="scalar-init.mjs"></script>
  </body>
</html>
